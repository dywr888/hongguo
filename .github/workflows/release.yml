name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure release signing
        run: |
          if [ -n "$STORE_FILE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$STORE_FILE" | base64 -d > hongguo.jks
            cat > keystore.properties <<PROP
          storeFile=/root/work/hongguo/hongguo.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROP
            echo 'signed: release'
          else
            echo 'signed: debug-fallback'
          fi
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        timeout-minutes: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hongguo Module ${{ github.ref_name }}
          body: |
            ## Hongguo Module ${{ github.ref_name }}
            - Xposed/LSPosed module for Hongguo short drama
            - Supports: 7.4.5.32, 7.4.3.32, 7.3.3.18, 7.3.2.32, 7.3.1.32
            - Built by GitHub Actions
            - Signing: release (if secrets configured) else debug-fallback
          files: app/build/outputs/apk/release/app-release.apk
